<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Monoton&display=swap"
            rel="stylesheet"
    />
    <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap"
            rel="stylesheet"
    />
</head>
<body>
<div class="blob"></div>
<div id="content">
    <h1 class="neon" data-text="U">WEA<span class="flicker-slow">T</span>HER A<span class="flicker-slow">P</span><span class="flicker-fast">P</span></h1>
    <div id="input-container">
        <label for="address">Enter city name or address:</label>
        <input type="text" id="address" placeholder="City or address">
        <button id="getWeather">Get Weather</button>
    </div>
    <div id="results"></div>
</div>
<script src="script.js"></script>
</body>
</html>
